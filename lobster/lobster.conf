# ---- paths -------------------------------------------------------------
# Where the finished SCF runs live (geometry is taken from there, read-only).
SRC_DIR=/home2/mukhachev/00_Omega_test_PhD/GdMnSi/restart
# Where the LOBSTER runs will be created.
SERIES_DIR=/home2/mukhachev/00_Omega_test_PhD/GdMnSi/lobster

QE_BIN=/mnt/wizardry/qe/build/bin
LOBSTER_BIN=/home2/mukhachev/src/lobster-5.1.1/lobster-5.1.1
LOPOSTER_BIN=/home2/mukhachev/bin/loposter

# ---- points ------------------------------------------------------------
POINTS="z12 z18 z2074"

# ---- cluster -----------------------------------------------------------
PARTITION=trollen
NCORES=48

# ---- SCF for LOBSTER ---------------------------------------------------
# Full explicit k-mesh (nosym/noinv). Start small, raise after the first run.
KMESH="6 6 3"
# Must be >= number of LOBSTER basis functions (see README).
NBND=170

# ---- lobsterin ---------------------------------------------------------
BASIS_SET=pbeVaspFit2015
COHP_EMIN=-12
COHP_EMAX=6
COHP_RMAX=4.0
SMEARING=0.05
# Write the real-space tight-binding Hamiltonian (yes/no).
REAL_SPACE_H=yes
# Extra verbatim lines for lobsterin (e.g. the QE file-pointing keywords
# from the manual's QE example). Separate several lines with ';'.
EXTRA_LINES=
