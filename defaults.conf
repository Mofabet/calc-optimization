# =====================================================================
#  Shared settings for one series of calculations.
#
#  Place this next to bin/, one level above the structure directories.
#  scf2conf.py picks it up automatically and stamps these values into every
#  system.conf it generates, so a decision is made once rather than per
#  folder.
#
#  Only the keys below may appear here. Anything taken from the completed
#  SCF -- prefix, cell, positions, pseudopotentials, cutoffs -- is read from
#  scf.in and cannot be overridden; scf2conf.py warns if you try.
#
#  {TM} expands to the transition metal detected in each structure, so the
#  same file works for a Mn series and a Ru series.
# =====================================================================

# --- Wannier model ----------------------------------------------------
# Keep identical across the series, or the t_eff values are not comparable.
PROJECTIONS={TM}:d;Si:p

# Energy windows, as offsets below/above E_F in eV.
# The outer window defines the model subspace; it should be no wider than the
# physics requires. In rare-earth compounds it is bounded by the 4f manifolds
# on both sides -- run  count_bands.py --histogram  on one structure to see
# where they sit, then set these once for the whole series.
DIS_WIN_LO=7.0
DIS_WIN_HI=2.5
DIS_FROZ_LO=4.0
DIS_FROZ_HI=1.5

DIS_NUM_ITER=1000
NUM_ITER=500

# --- k-mesh -----------------------------------------------------------
# Given for the primitive cell. Each structure's mesh is this divided by its
# detected supercell multiplicity, which keeps the real-space range of H(R)
# the same for primitive and supercell members of the series.
KMESH_PRIMITIVE=12 12 12

# --- bands carried into the Wannier stage -----------------------------
# NBND_NSCF is set per structure as (bands below E_F + NBND_WINDOW) plus
# NBND_MARGIN, counted from the eigenvalues in scf.out. The .mmn file scales
# as num_bands^2, so this is worth keeping tight; the margin exists so the
# windows can be adjusted later without redoing the NSCF.
NBND_WINDOW=10
NBND_MARGIN=10

# --- analysis ---------------------------------------------------------
PAIRS={TM}-Si,{TM}-{TM}
DMAX=5.0
TMIN=0.02

# --- site-specific ----------------------------------------------------
QE_BIN=
W90_BIN=
SRUN_OPTS=-n 16
